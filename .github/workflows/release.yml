name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use x.y.z format, for example 1.0.0"
            exit 1
          fi

      - name: Check release target
        run: |
          tag="v${{ inputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "$tag already exists"
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag release already exists"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Homebrew tap token
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required to update haydenull/homebrew-tap"
            exit 1
          fi
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  build-mac:
    runs-on: macos-latest
    needs: validate-release

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Update package version
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and main
        run: pnpm run build

      - name: Build mac artifacts
        run: pnpm exec electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            !dist/builder-debug.yml
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: validate-release

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Update package version
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and main
        run: pnpm run build

      - name: Build Windows artifacts
        run: pnpm exec electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            !dist/builder-debug.yml
          if-no-files-found: error

  publish-release:
    runs-on: macos-latest
    needs:
      - build-mac
      - build-windows

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Update package version
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version

      - name: Publish release
        run: |
          set -euo pipefail

          tag="v${{ inputs.version }}"
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find release-assets -type f -print0)

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets found"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): 🔧 发布 $tag"
          git tag "$tag"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "$tag"

          gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    runs-on: macos-latest
    needs: publish-release

    steps:
      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release-mac

      - name: Prepare cask values
        id: cask
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          arm_dmg="release-mac/skills-manager-${version}-arm64.dmg"
          x64_dmg="release-mac/skills-manager-${version}-x64.dmg"

          for file in "$arm_dmg" "$x64_dmg"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing expected mac artifact: $file"
              exit 1
            fi
          done

          arm_sha="$(shasum -a 256 "$arm_dmg")"
          x64_sha="$(shasum -a 256 "$x64_dmg")"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arm_sha=${arm_sha%% *}" >> "$GITHUB_OUTPUT"
          echo "x64_sha=${x64_sha%% *}" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: haydenull/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require "fileutils"

          version = ENV.fetch("VERSION")
          arm_sha = ENV.fetch("ARM_SHA")
          x64_sha = ENV.fetch("X64_SHA")

          FileUtils.mkdir_p("Casks")
          File.write("Casks/skills-manager.rb", <<~CASK)
            cask "skills-manager" do
              arch arm: "arm64", intel: "x64"

              version "#{version}"
              sha256 arm:   "#{arm_sha}",
                     intel: "#{x64_sha}"

              url "https://github.com/haydenull/skills-manager/releases/download/v\#{version}/skills-manager-\#{version}-\#{arch}.dmg"
              name "Skills Manager"
              desc "Desktop skills manager for Claude Code and Codex"
              homepage "https://github.com/haydenull/skills-manager"

              depends_on macos: ">= :monterey"

              app "Skills Manager.app"
            end
          CASK
          RUBY
        env:
          VERSION: ${{ steps.cask.outputs.version }}
          ARM_SHA: ${{ steps.cask.outputs.arm_sha }}
          X64_SHA: ${{ steps.cask.outputs.x64_sha }}

      - name: Audit cask
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          tap_root="$(brew --repository)/Library/Taps/haydenull"
          tap_path="$tap_root/homebrew-tap"

          mkdir -p "$tap_root"
          if [[ ! -e "$tap_path" ]]; then
            ln -s "$PWD" "$tap_path"
          fi

          brew audit --cask --online haydenull/tap/skills-manager

      - name: Commit Homebrew tap update
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          if [[ -z "$(git status --short Casks/skills-manager.rb)" ]]; then
            echo "Homebrew cask is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/skills-manager.rb
          git commit -m "Update skills-manager to ${{ inputs.version }}"
          git push
